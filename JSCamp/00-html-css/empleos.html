<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devjobs - Empleos</title>
    <meta
      name="description"
      content="Encuentra las mejores ofertas de trabajo para desarrolladores en DevJobs."
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>
        <svg
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        DevJobs
      </h1>

      <nav>
        <a href="index.html"> Inicio </a>
        <a href="empleos.html">Empleos</a>
      </nav>
      <div>
        <a href="">Publicar un empleo</a>
        <!-- <a href="">Iniciar sesión</a> -->
      </div>
    </header>
    <main>
      <section>
        <h1>Encuentra tu próximo empleo</h1>
        <p>Explora miles de oportunidades en el sector tecnológico.</p>

        <form role="search">
          <div>
            <div>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-search"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                <path d="M21 21l-6 -6" />
              </svg>

              <input
                required
                type="text"
                placeholder="Buscar empleos por título, habilidad o empresa"
              />
            </div>
          </div>
        </form>
        <div class="filters">
          <!-- Tecnología -->
          <select name="tecnologia" id="tecnologia">
            <option value="" selected>Tecnología</option>
            <option value="frontend">Frontend</option>
            <option value="backend">Backend</option>
            <option value="fullstack">Full Stack</option>
            <option value="mobile">Mobile</option>
            <option value="devops">DevOps</option>
            <option value="data">Data / BI</option>
            <option value="ai-ml">AI / ML</option>
            <option value="qa">QA / Testing</option>
            <option value="security">Ciberseguridad</option>
            <option value="ux-ui">UX / UI</option>
          </select>

          <!-- Ubicación -->
          <select name="ubicacion" id="ubicacion">
            <option value="" selected>Ubicación</option>
            <option value="remoto">Remoto</option>
            <option value="hibrido">Híbrido</option>
            <option value="presencial">Presencial</option>
            <option value="quito">Quito</option>
            <option value="guayaquil">Guayaquil</option>
            <option value="cuenca">Cuenca</option>
            <option value="latam">LatAm</option>
            <option value="usa">USA</option>
            <option value="europa">Europa</option>
          </select>

          <!-- Nivel de experiencia -->
          <select name="experiencia" id="experiencia">
            <option value="" selected>Nivel de experiencia</option>
            <option value="intern">Practicante / Intern</option>
            <option value="junior">Junior</option>
            <option value="semi-senior">Semi Senior</option>
            <option value="senior">Senior</option>
            <option value="lead">Tech Lead</option>
            <option value="manager">Engineering Manager</option>
            <option value="architect">Arquitecto/a</option>
          </select>
        </div>
      </section>
    </main>
    <footer>
      <small>&copy; 2025 DevJobs. Todos los derechos reservados.</small>
    </footer>
  </body>
</html>
